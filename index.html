<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>3D City Test</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
    </style>

    <!-- Three.js core -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<script>
// === BASIC SCENE SETUP ===
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb); // sky blue

const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);
camera.position.set(150, 150, 250);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// === TEST CUBE (bright red) ===
const testCube = new THREE.Mesh(
    new THREE.BoxGeometry(20, 20, 20),
    new THREE.MeshBasicMaterial({ color: 0xff0000 })
);
testCube.position.set(0, 10, 0);
scene.add(testCube);

// === GROUND (green) ===
const groundGeometry = new THREE.PlaneGeometry(800, 800);
const groundMaterial = new THREE.MeshBasicMaterial({ color: 0x00aa00 });
const ground = new THREE.Mesh(groundGeometry, groundMaterial);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

// === STREETS (dark gray) ===
function createStreet(x, z, width, depth) {
    const geometry = new THREE.BoxGeometry(width, 0.1, depth);
    const material = new THREE.MeshBasicMaterial({ color: 0x333333 });
    const street = new THREE.Mesh(geometry, material);
    street.position.set(x, 0.05, z);
    scene.add(street);
}

// Horizontal streets
createStreet(0, -50, 600, 20);
createStreet(0, 0, 600, 20);
createStreet(0, 50, 600, 20);

// Vertical streets
createStreet(-100, 0, 20, 300);
createStreet(0, 0, 20, 300);
createStreet(100, 0, 20, 300);

// === BUILDINGS (colored boxes) ===
function createBuilding(x, z, width, height, depth, color) {
    const geometry = new THREE.BoxGeometry(width, height, depth);
    const material = new THREE.MeshBasicMaterial({ color });
    const building = new THREE.Mesh(geometry, material);
    building.position.set(x, height / 2, z);
    scene.add(building);
}

const buildingColors = [0xff6666, 0x66a3ff, 0xffcc66, 0x66ff99, 0xcc99ff];

for (let i = -250; i <= 250; i += 50) {
    createBuilding(i, -80, 20, Math.random() * 40 + 20, 20,
        buildingColors[Math.floor(Math.random() * buildingColors.length)]
    );
    createBuilding(i, 80, 20, Math.random() * 40 + 20, 20,
        buildingColors[Math.floor(Math.random() * buildingColors.length)]
    );
    createBuilding(-130, i, 20, Math.random() * 40 + 20, 20,
        buildingColors[Math.floor(Math.random() * buildingColors.length)]
    );
    createBuilding(130, i, 20, Math.random() * 40 + 20, 20,
        buildingColors[Math.floor(Math.random() * buildingColors.length)]
    );
}

// === RESIZE HANDLER ===
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// === ANIMATION LOOP ===
function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
