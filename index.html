<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3D Pompeii Explorer</title>
<style>
    body {
        margin: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
    }

    #info-box {
        position: absolute;
        top: 20px;
        left: 20px;
        padding: 12px;
        background: rgba(255,255,255,0.9);
        border: 2px solid #333;
        display: none;
        max-width: 250px;
    }

    #info-box h2 {
        margin-top: 0;
    }
</style>
</head>
<body>

<div id="info-box">
    <h2 id="info-title"></h2>
    <p id="info-text"></p>
</div>

<!-- Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<!-- FIXED OrbitControls link -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>

<script>
// Scene
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbfd1e5);

// Camera (FIXED: now looks at the scene)
const camera = new THREE.PerspectiveCamera(
    60, window.innerWidth / window.innerHeight, 0.1, 1000
);
camera.position.set(15, 15, 15);
camera.lookAt(0, 0, 0);

// Renderer
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Controls (zoom, rotate, pan)
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// Ground (FIXED: darker so it’s visible)
const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(100, 100),
    new THREE.MeshPhongMaterial({ color: 0x555555 })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

// Lighting
const sun = new THREE.DirectionalLight(0xffffff, 1);
sun.position.set(20, 40, 20);
scene.add(sun);

scene.add(new THREE.AmbientLight(0xffffff, 0.4));

// Buildings
const buildings = [
    {
        name: "House of the Faun",
        description: "One of Pompeii’s largest and most luxurious residences.",
        position: { x: -10, y: 1, z: -5 }
    },
    {
        name: "Forum",
        description: "The political, commercial, and religious center of Pompeii.",
        position: { x: 5, y: 1, z: 0 }
    },
    {
        name: "Amphitheatre",
        description: "Used for gladiator games and public entertainment.",
        position: { x: 10, y: 1, z: -10 }
    }
];

const buildingMeshes = [];
const boxGeometry = new THREE.BoxGeometry(4, 2, 4);
const boxMaterial = new THREE.MeshPhongMaterial({ color: 0xcc4444 });

buildings.forEach((b, i) => {
    const mesh = new THREE.Mesh(boxGeometry, boxMaterial.clone());
    mesh.position.set(b.position.x, b.position.y, b.position.z);
    mesh.userData = { index: i };
    scene.add(mesh);
    buildingMeshes.push(mesh);
});

// Raycaster for clicking
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

function onClick(event) {
    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(buildingMeshes);

    if (hits.length > 0) {
        const building = buildings[hits[0].object.userData.index];
        showInfo(building.name, building.description);
    }
}

function showInfo(title, text) {
    document.getElementById("info-title").textContent = title;
    document.getElementById("info-text").textContent = text;
    document.getElementById("info-box").style.display = "block";
}

window.addEventListener("click", onClick);

// Resize handling
window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// Animation loop (FIXED: guaranteed to run)
function animate() {
    controls.update();
    renderer.render(scene, camera);
    requestAnimationFrame(animate);
}
animate();
</script>

</body>
</html>
